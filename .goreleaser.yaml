version: 2
project_name: mmproxy
builds:
  - binary: mmproxy
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: zekihan
    name: mmproxy
