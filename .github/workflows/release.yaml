name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
concurrency:
  group: mmproxy-release
  cancel-in-progress: false
jobs:
  decide:
    uses: zekihan/release-workflows/.github/workflows/decide.yaml@e01866efdad68a2304156b36267e742f0fc5e4d4 # main
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      mode: release
      image: mmproxy
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  checks:
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    uses: ./.github/workflows/checks.yaml
  publish:
    needs: [decide, checks]
    uses: zekihan/release-workflows/.github/workflows/image.yaml@e01866efdad68a2304156b36267e742f0fc5e4d4 # main
    permissions:
      contents: read
      packages: write
    with:
      image: mmproxy
      mode: release
      version: ${{ needs.decide.outputs.version }}
      fingerprint: ${{ needs.decide.outputs.fingerprint }}
      qemu: false
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  release:
    needs: [decide, checks, publish]
    uses: zekihan/release-workflows/.github/workflows/release.yaml@e01866efdad68a2304156b36267e742f0fc5e4d4 # main
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.decide.outputs.version }}
      image: mmproxy
      image-digest: ${{ needs.publish.outputs.digest }}
      binaries: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
