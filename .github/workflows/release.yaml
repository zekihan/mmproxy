name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
concurrency:
  group: mmproxy-release
  cancel-in-progress: false
jobs:
  decide:
    uses: zekihan/release-workflows/.github/workflows/decide.yaml@98a85ab2b0ae4dd702aa142b1369277404f124df # main
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      mode: release
      image: mmproxy
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  checks:
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    uses: ./.github/workflows/checks.yaml
  publish:
    needs: [decide, checks]
    uses: zekihan/release-workflows/.github/workflows/image.yaml@98a85ab2b0ae4dd702aa142b1369277404f124df # main
    permissions:
      contents: read
      packages: write
    with:
      image: mmproxy
      mode: release
      version: ${{ needs.decide.outputs.version }}
      fingerprint: ${{ needs.decide.outputs.fingerprint }}
      qemu: false
      smoke-command: |
        container=$(docker run --detach --cap-drop=ALL --cap-add=NET_ADMIN \
          -e MMPROXY_SETUP_ROUTING=true local/publishing-smoke:latest \
          -listen-transparent -l 127.0.0.1:0)
        trap 'docker rm -f "$container" >/dev/null' EXIT
        test "$(docker inspect --format '{{.Config.User}}' "$container")" = 65532:65532
        for attempt in {1..20}; do
          if docker logs "$container" 2>&1 | grep -F '"msg":"listening"'; then
            exit 0
          fi
          if [[ $(docker inspect --format '{{.State.Running}}' "$container") != true ]]; then
            break
          fi
          sleep 0.25
        done
        docker logs "$container"
        exit 1
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  release:
    needs: [decide, checks, publish]
    uses: zekihan/release-workflows/.github/workflows/release.yaml@98a85ab2b0ae4dd702aa142b1369277404f124df # main
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.decide.outputs.version }}
      image: mmproxy
      image-digest: ${{ needs.publish.outputs.digest }}
      binaries: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
